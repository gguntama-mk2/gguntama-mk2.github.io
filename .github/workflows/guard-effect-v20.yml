name: V20 Japanese Hit-Reaction Provenance Review
on:
  push:
    branches: [test/icon-auto-add-replace-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-japanese-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate v19 from original production-mirrored PC and SP move data
        run: |
          python -m py_compile tests/guard_effect_v15.py tests/guard_effect_v16.py tests/guard_effect_v17.py tests/guard_effect_v18.py tests/guard_effect_v19.py tests/guard_effect_v20.py
          for target in pc sp; do
            node tools/build-hit-state-sidecar-v13.mjs "$target.html" "/tmp/pt-v20/$target-v13"
            node tools/audit-guard-crouch-v14.mjs "$target.html" "/tmp/pt-v20/$target-v13/v13_hit_state_review.json" "/tmp/pt-v20/$target-v14"
            python tests/guard_effect_v15.py "/tmp/pt-v20/$target-v14/V14_GUARD_REVIEW.json" "/tmp/pt-v20/$target-v15"
            python tests/guard_effect_v16.py "/tmp/pt-v20/$target-v15/V15_778_REVIEW.json" "/tmp/pt-v20/$target-v15/V15_REVIEW_128_DEDUPED.csv" test-data/v16-public-guard-evidence.json "/tmp/pt-v20/$target-v16"
            python tests/guard_effect_v17.py "/tmp/pt-v20/$target-v16/V16_128_REVIEW.json" test-data/v17-japanese-source-review.json "/tmp/pt-v20/$target-v17"
            python tests/guard_effect_v18.py "/tmp/pt-v20/$target-v17/V17_JAPANESE_REVIEW.json" test-data/v18-japanese-evidence-batch.json "/tmp/pt-v20/$target-v18"
            python tests/guard_effect_v19.py "/tmp/pt-v20/$target-v18/V18_JAPANESE_REVIEW.json" test-data/v19-japanese-evidence-batch.json "/tmp/pt-v20/$target-v19"
            python tests/guard_effect_v20.py "/tmp/pt-v20/$target-v19/V19_JAPANESE_REVIEW.json" test-data/v20-japanese-evidence-batch.json "/tmp/pt-v20/$target"
          done
          cp test-data/v20-jp-evidence-view.html /tmp/pt-v20/pc/index.html
      - name: Confirm 128 fixed move keys and 16 Japanese source distinctions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/pt-v20')
          pc=json.loads((root/'pc/V20_JAPANESE_REVIEW.json').read_text())
          sp=json.loads((root/'sp/V20_JAPANESE_REVIEW.json').read_text())
          assert pc==sp,'PC/SP output mismatch'
          s=pc['summary']
          assert (s['priority_groups'],s['new_japanese_checks'],s['japanese_reviewed_total'],s['japanese_unreviewed'])==(128,14,59,69)
          assert (s['japanese_explicit'],s['japanese_notation_only'],s['japanese_numeric_conflict'])==(19,30,6)
          assert (s['japanese_notation_disagreement'],s['japanese_attacker_crouch_risk'])==(3,1)
          assert (s['new_explicit'],s['new_notation_only'],s['new_notation_disagreement'])==(6,6,2)
          assert s['binary_hit_reaction_verified']==s['icon_assignments_saved']==s['production_changes']==s['non_japanese_confirmation_count']==0
          items={r['move_id']:r for r in pc['records']}
          assert len(items)==128
          assert sum(r['newly_reviewed_v20'] for r in items.values())==14
          for id in ('asuka/140','asuka/141','yoshimitsu/30','yoshimitsu/162','yoshimitsu/378','yoshimitsu/396'):
              assert items[id]['jp_status']=='jp_explicit', id
          for id in ('jun/154','jun/155'):
              assert items[id]['jp_status']=='jp_notation_disagreement'
          assert items['leo/110']['jp_status']=='jp_notation_only'
          assert all(not r['approved_icon'] and not r['reviewed_current_version_binary'] and not r['overseas_used_for_approval'] for r in items.values())
          print('PASS V20: 14 Japanese source reviews, 69 pending, 0 binary-confirmed icons')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test PC and mobile Japanese-source review frontend
        run: |
          (cd /tmp/pt-v20/pc && python -m http.server 8740 --bind 127.0.0.1 > /tmp/pt-v20/server.log 2>&1) &
          python - <<'PY'
          import time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8740/index.html'
          for _ in range(40):
              try:urllib.request.urlopen(url,timeout=3);break
              except Exception:time.sleep(1)
          else:raise RuntimeError('viewer not reachable')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              for name,viewport in [('PC',{'width':1440,'height':900}),('SP',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport)
                  page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("document.body.dataset.ready==='true'",timeout=45000)
                  assert page.locator('tbody tr').count()==128
                  assert page.locator('#explicit').inner_text()=='19'
                  assert page.locator('#notation').inner_text()=='30'
                  assert page.locator('#conflict').inner_text()=='6'
                  assert page.locator('#notationRisk').inner_text()=='3'
                  assert page.locator('#attacker').inner_text()=='1'
                  assert page.locator('#remaining').inner_text()=='69'
                  page.locator('#newonly').select_option('yes')
                  assert page.locator('tbody tr').count()==14
                  page.locator('#status').select_option('jp_explicit')
                  assert page.locator('tbody tr').count()==6
                  assert page.locator('tbody tr[data-id="asuka/140"] a').count()==2
                  assert page.locator('tbody tr[data-id="yoshimitsu/162"] a').count()==2
                  page.locator('#status').select_option('jp_notation_disagreement')
                  assert page.locator('tbody tr').count()==1
                  assert page.locator('tbody tr[data-id="jun/154"]').count()==1
                  page.locator('#status').select_option('jp_attacker_crouch_risk')
                  assert page.locator('tbody tr').count()==0
                  page.locator('#status').select_option('')
                  page.screenshot(path=str(Path('/tmp/pt-v20/pc')/(name+'_V20_JAPANESE_REVIEW.png')),full_page=False)
                  page.close()
              browser.close()
          print('PASS V20 PC and mobile frontend, 16 additions and source risk filters')
          PY
      - name: Show diff guard (all source editing limited to test branch)
        if: always()
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PROJECT_T_V20_JAPANESE_EVIDENCE
          path: |
            /tmp/pt-v20/pc/
            /tmp/pt-v20/server.log
          retention-days: 30
          if-no-files-found: warn

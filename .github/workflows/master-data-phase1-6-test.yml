name: master-data-phase1-6-test

on:
  push:
    branches:
      - test/master-data-phase1-6-20261103
  workflow_dispatch:

jobs:
  frontend-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production pages remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test -z "$(git diff origin/main...HEAD -- pc.html sp.html admin.html admin.js checksheet-base.json)"
      - name: Check adapter JavaScript syntax
        run: node --check project-t-master-adapter.js
      - name: Verify test harness references adapter
        run: grep -q 'project-t-master-adapter.js' master-data-test.html
      - name: Serve actual test frontend over HTTP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8002 --bind 127.0.0.1 > /tmp/project-t-site-test.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            code=$?
            echo "--- static server log ---"
            cat /tmp/project-t-site-test.log || true
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            exit "$code"
          }
          trap cleanup EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8002/master-data-test.html >/tmp/master-data-test.html; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8002/master-data-test.html >/tmp/master-data-test.html
          curl --fail --silent http://127.0.0.1:8002/project-t-master-adapter.js >/tmp/project-t-master-adapter.js
          grep -Fq 'PROJECT T — Master Data Phase ①〜⑥ テスト' /tmp/master-data-test.html
          grep -Fq 'global.PTMaster' /tmp/project-t-master-adapter.js
          echo 'SITE SMOKE OK'

name: Admin TEKKEN ID frontend syntax
on:
  pull_request:
    paths:
      - 'admin.js'
      - '.github/workflows/admin-tekken-id-js-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admin page JavaScript syntax
        run: node --check admin.js

name: V19 Japanese Source Hit-Reaction Review
on:
  push:
    branches: [test/icon-auto-add-replace-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-japanese-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate v19 from original production-mirrored PC and SP move data
        run: |
          python -m py_compile tests/guard_effect_v15.py tests/guard_effect_v16.py tests/guard_effect_v17.py tests/guard_effect_v18.py tests/guard_effect_v19.py
          for target in pc sp; do
            node tools/build-hit-state-sidecar-v13.mjs "$target.html" "/tmp/pt-v19/$target-v13"
            node tools/audit-guard-crouch-v14.mjs "$target.html" "/tmp/pt-v19/$target-v13/v13_hit_state_review.json" "/tmp/pt-v19/$target-v14"
            python tests/guard_effect_v15.py "/tmp/pt-v19/$target-v14/V14_GUARD_REVIEW.json" "/tmp/pt-v19/$target-v15"
            python tests/guard_effect_v16.py "/tmp/pt-v19/$target-v15/V15_778_REVIEW.json" "/tmp/pt-v19/$target-v15/V15_REVIEW_128_DEDUPED.csv" test-data/v16-public-guard-evidence.json "/tmp/pt-v19/$target-v16"
            python tests/guard_effect_v17.py "/tmp/pt-v19/$target-v16/V16_128_REVIEW.json" test-data/v17-japanese-source-review.json "/tmp/pt-v19/$target-v17"
            python tests/guard_effect_v18.py "/tmp/pt-v19/$target-v17/V17_JAPANESE_REVIEW.json" test-data/v18-japanese-evidence-batch.json "/tmp/pt-v19/$target-v18"
            python tests/guard_effect_v19.py "/tmp/pt-v19/$target-v18/V18_JAPANESE_REVIEW.json" test-data/v19-japanese-evidence-batch.json "/tmp/pt-v19/$target"
          done
          cp test-data/v19-jp-evidence-view.html /tmp/pt-v19/pc/index.html
      - name: Confirm 128 fixed move keys and 16 Japanese source distinctions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/pt-v19')
          pc=json.loads((root/'pc/V19_JAPANESE_REVIEW.json').read_text())
          sp=json.loads((root/'sp/V19_JAPANESE_REVIEW.json').read_text())
          assert pc==sp,'PC/SP output mismatch'
          s=pc['summary']
          assert (s['priority_groups'],s['new_reviews'],s['jp_reviewed_total'],s['japanese_unreviewed'])==(128,16,45,83)
          assert (s['japanese_explicit'],s['japanese_notation_only'],s['japanese_numeric_conflict'])==(13,24,6)
          assert (s['japanese_notation_disagreement'],s['japanese_attacker_crouch_risk'])==(1,1)
          assert s['game_binary_verified']==s['auto_icon_assignments']==s['production_changes']==s['overseas_as_approval_evidence']==0
          items={r['move_id']:r for r in pc['records']}
          assert len(items)==128
          assert sum(r['newly_reviewed_v19'] for r in items.values())==16
          for k in ('nina/147','lili/119','devil-jin/69','jack8/124'):
              assert items[k]['jp_status']=='jp_explicit'
          for k in ('devil-jin/84','shaheen/26'):
              assert items[k]['jp_status']=='jp_numeric_conflict'
          assert items['jin/175']['jp_status']=='jp_notation_disagreement'
          assert items['claudio/19']['jp_status']=='jp_attacker_crouch_risk'
          assert all(not r['approved_icon'] and not r['reviewed_current_version_binary'] and not r['overseas_used_for_approval'] for r in items.values())
          print('PASS V19: 16 new Japanese source reviews, 83 pending, 0 icon assignments')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test PC and mobile Japanese-source review frontend
        run: |
          (cd /tmp/pt-v19/pc && python -m http.server 8740 --bind 127.0.0.1 > /tmp/pt-v19/server.log 2>&1) &
          python - <<'PY'
          import time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8740/index.html'
          for _ in range(40):
              try:urllib.request.urlopen(url,timeout=3);break
              except Exception:time.sleep(1)
          else:raise RuntimeError('viewer not reachable')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              for name,viewport in [('PC',{'width':1440,'height':900}),('SP',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport)
                  page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("document.body.dataset.ready==='true'",timeout=45000)
                  assert page.locator('tbody tr').count()==128
                  assert page.locator('#explicit').inner_text()=='13'
                  assert page.locator('#notation').inner_text()=='24'
                  assert page.locator('#conflict').inner_text()=='6'
                  assert page.locator('#notationRisk').inner_text()=='1'
                  assert page.locator('#attacker').inner_text()=='1'
                  assert page.locator('#remaining').inner_text()=='83'
                  page.locator('#newonly').select_option('yes')
                  assert page.locator('tbody tr').count()==16
                  page.locator('#status').select_option('jp_explicit')
                  assert page.locator('tbody tr').count()==4
                  assert page.locator('tbody tr[data-id="nina/147"] a').count()==2
                  page.locator('#status').select_option('jp_notation_disagreement')
                  assert page.locator('tbody tr').count()==1
                  assert page.locator('tbody tr[data-id="jin/175"]').count()==1
                  page.locator('#status').select_option('jp_attacker_crouch_risk')
                  assert page.locator('tbody tr[data-id="claudio/19"]').count()==1
                  page.locator('#status').select_option('')
                  page.screenshot(path=str(Path('/tmp/pt-v19/pc')/(name+'_V19_JAPANESE_REVIEW.png')),full_page=False)
                  page.close()
              browser.close()
          print('PASS V19 PC and mobile frontend, 16 additions and source risk filters')
          PY
      - name: Show diff guard (all source editing limited to test branch)
        if: always()
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PROJECT_T_V19_JAPANESE_EVIDENCE
          path: |
            /tmp/pt-v19/pc/
            /tmp/pt-v19/server.log
          retention-days: 30
          if-no-files-found: warn

name: V24 Conditional Crouch and Bob Floor Evidence E2E
on:
  push:
    branches: [test/icon-auto-add-replace-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-japanese-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate v23 from production-clone PC and SP data
        run: |
          python -m py_compile tests/guard_effect_v15.py tests/guard_effect_v16.py tests/guard_effect_v17.py tests/guard_effect_v18.py tests/guard_effect_v19.py tests/guard_effect_v20.py tests/guard_effect_v21.py tests/guard_effect_v22.py tests/guard_effect_v23.py tests/guard_effect_v24.py tests/validate-game-icon-evidence-v21.py
          for target in pc sp; do
            node tools/build-hit-state-sidecar-v13.mjs "$target.html" "/tmp/pt-v24/$target-v13"
            node tools/audit-guard-crouch-v14.mjs "$target.html" "/tmp/pt-v24/$target-v13/v13_hit_state_review.json" "/tmp/pt-v24/$target-v14"
            python tests/guard_effect_v15.py "/tmp/pt-v24/$target-v14/V14_GUARD_REVIEW.json" "/tmp/pt-v24/$target-v15"
            python tests/guard_effect_v16.py "/tmp/pt-v24/$target-v15/V15_778_REVIEW.json" "/tmp/pt-v24/$target-v15/V15_REVIEW_128_DEDUPED.csv" test-data/v16-public-guard-evidence.json "/tmp/pt-v24/$target-v16"
            python tests/guard_effect_v17.py "/tmp/pt-v24/$target-v16/V16_128_REVIEW.json" test-data/v17-japanese-source-review.json "/tmp/pt-v24/$target-v17"
            python tests/guard_effect_v18.py "/tmp/pt-v24/$target-v17/V17_JAPANESE_REVIEW.json" test-data/v18-japanese-evidence-batch.json "/tmp/pt-v24/$target-v18"
            python tests/guard_effect_v19.py "/tmp/pt-v24/$target-v18/V18_JAPANESE_REVIEW.json" test-data/v19-japanese-evidence-batch.json "/tmp/pt-v24/$target-v19"
            python tests/guard_effect_v20.py "/tmp/pt-v24/$target-v19/V19_JAPANESE_REVIEW.json" test-data/v20-japanese-evidence-batch.json "/tmp/pt-v24/$target-v20"
            python tests/guard_effect_v21.py "/tmp/pt-v24/$target-v20/V20_JAPANESE_REVIEW.json" test-data/v21-japanese-evidence-batch.json "/tmp/pt-v24/$target-v21"
            python tests/guard_effect_v22.py "/tmp/pt-v24/$target-v21/V21_JAPANESE_REVIEW.json" test-data/v22-japanese-evidence-batch.json "/tmp/pt-v24/$target-v22"
            python tests/guard_effect_v23.py "/tmp/pt-v24/$target-v22/V22_JAPANESE_REVIEW.json" test-data/v23-japanese-evidence-batch.json "/tmp/pt-v24/$target-v23"
            python tests/guard_effect_v24.py "/tmp/pt-v24/$target-v23/V23_JAPANESE_REVIEW.json" test-data/v24-japanese-evidence-batch.json "/tmp/pt-v24/$target"
            python tests/validate-game-icon-evidence-v21.py "/tmp/pt-v24/$target/V24_JAPANESE_REVIEW.json" test-data/v21-game-icon-observations.json
          done
          cp test-data/v24-jp-evidence-view.html /tmp/pt-v24/pc/index.html
          cp test-data/v21-game-icon-observations.json /tmp/pt-v24/pc/
          for icon in forcedcrouch wallbreak floorgimmick; do cp "icons/$icon.webp" "/tmp/pt-v24/pc/$icon.webp"; done
      - name: Check 10 new source reviews, two ambiguous guard branches and Bob floor activation quarantined
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/pt-v24')
          pc=json.loads((root/'pc/V24_JAPANESE_REVIEW.json').read_text())
          sp=json.loads((root/'sp/V24_JAPANESE_REVIEW.json').read_text())
          assert pc==sp,'PC/SP output mismatch'
          s=pc['summary']
          assert (s['review_total'],s['new_japanese_reviews'],s['japanese_reviewed_total'],s['japanese_pending'])==(128,10,106,22)
          assert (s['jp_explicit'],s['jp_notation_only'],s['jp_numeric_conflict'])==(40,45,11)
          assert (s['jp_conditional_guard_branch'],s['jp_low_guard_risk'])==(2,2)
          assert (s['jp_notation_disagreement'],s['jp_attacker_crouch_risk'],s['jp_variant_mapping_risk'])==(4,1,1)
          assert s['binary_verified']==s['icon_assignment_writes']==s['production_changes']==0
          indexed={r['move_id']:r for r in pc['records']}
          assert len(indexed)==128
          assert sum(r['newly_reviewed_v24'] for r in indexed.values())==10
          for k in ('asuka/28','asuka/168'):
              assert indexed[k]['jp_status']=='jp_conditional_guard_branch'
              assert indexed[k]['site_guard']=='-3(-19s)'
          for k in ('lars/143','lars/144'):
              assert indexed[k]['jp_status']=='jp_low_guard_risk'
          assert indexed['yoshimitsu/16']['jp_status']=='jp_explicit'
          assert indexed['feng/196']['jp_status']=='jp_numeric_conflict'
          assert all(not r['approved_icon'] and not r['reviewed_current_version_binary'] for r in indexed.values())
          matrix=json.loads((root/'pc/V24_BOB184_FLOOR_MATRIX.json').read_text())
          matrix_sp=json.loads((root/'sp/V24_BOB184_FLOOR_MATRIX.json').read_text())
          assert matrix==matrix_sp
          assert matrix['move_id']=='bob/184' and matrix['icon_assignment_approved'] is False
          assert set(matrix['activation_by_target_state'].values())=={'unverified'}
          assert not json.loads(Path('test-data/v21-game-icon-observations.json').read_text())['observations']
          print('PASS V24: 10 new candidates; Bob floor ability not confused with ground/air activation')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Test PC and mobile Japanese-source review frontend
        run: |
          (cd /tmp/pt-v24/pc && python -m http.server 8740 --bind 127.0.0.1 > /tmp/pt-v24/server.log 2>&1) &
          python - <<'PY'
          import time,urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8740/index.html'
          for _ in range(40):
              try:urllib.request.urlopen(url,timeout=3);break
              except Exception:time.sleep(1)
          else:raise RuntimeError('viewer not reachable')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              for name,viewport in [('PC',{'width':1440,'height':900}),('SP',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport)
                  page.goto(url,wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_function("document.body.dataset.ready==='true'",timeout=45000)
                  assert page.locator('tbody tr').count()==128
                  assert page.locator('#explicit').inner_text()=='40'
                  assert page.locator('#notation').inner_text()=='45'
                  assert page.locator('#conflict').inner_text()=='11'
                  assert page.locator('#notationRisk').inner_text()=='4'
                  assert page.locator('#remaining').inner_text()=='22'
                  assert page.locator('#floorlead').inner_text()=='1'
                  assert page.locator('#conditional').inner_text()=='2'
                  assert page.locator('#lowrisk').inner_text()=='2'
                  assert page.locator('img[alt$="参照"]').count()==3
                  assert page.evaluate("Array.from(document.querySelectorAll('img[alt$=参照]')).every(x=>x.complete && x.naturalWidth>0)")
                  page.locator('#newonly').select_option('yes')
                  assert page.locator('tbody tr').count()==10
                  page.locator('#status').select_option('jp_conditional_guard_branch')
                  assert page.locator('tbody tr').count()==2
                  assert page.locator('tbody tr[data-id="asuka/28"]').count()==1
                  assert page.locator('tbody tr[data-id="asuka/168"]').count()==1
                  page.locator('#status').select_option('jp_low_guard_risk')
                  assert page.locator('tbody tr').count()==2
                  assert page.locator('tbody tr[data-id="lars/143"]').count()==1
                  page.locator('#status').select_option('jp_explicit')
                  assert page.locator('tbody tr').count()==1
                  assert page.locator('tbody tr[data-id="yoshimitsu/16"]').count()==1
                  page.locator('#status').select_option('jp_numeric_conflict')
                  assert page.locator('tbody tr').count()==1
                  assert page.locator('tbody tr[data-id="feng/196"]').count()==1
                  page.locator('#status').select_option('')
                  page.screenshot(path=str(Path('/tmp/pt-v24/pc')/(name+'_V24_JAPANESE_REVIEW.png')),full_page=False)
                  page.close()
              browser.close()
          print('PASS V24 PC/mobile, conditional guard branches and floor ability separated')
          PY
      - name: Show diff guard (all source editing limited to test branch)
        if: always()
        run: git status --short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PROJECT_T_V24_JAPANESE_EVIDENCE
          path: |
            /tmp/pt-v24/pc/
            /tmp/pt-v24/server.log
          retention-days: 30
          if-no-files-found: warn

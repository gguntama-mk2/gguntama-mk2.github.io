      - name: Profile three paired A-B rounds including simulated 4G and CPU throttling x4
        run: node tools/pt_lite_phase36_repeat.mjs
      - name: Diagnose fitNames time, DOM/render residual and browser layout/style metrics
        run: node tools/pt_lite_phase36_root_cause.mjs
      - name: Analyze median first-render, forced-layout, script duration, asset bytes and cache
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('phase36-performance')
          r=json.loads((root/'paired-repeat-report.json').read_text())
          assert r['passed'] and len(r['rounds'])>=3,r.get('failures')
          out={}
          for profile in ('desktop-fast','mobile-4g-simulated','low-end-cpu4x-4g'):
            for dev in ('pc','sp'):
              v=r['comparisons'][profile][dev]
              assert v['rounds']>=3
              assert v['median']['homeBytes']['after']<=v['median']['homeBytes']['before']+1100,(profile,dev,'home bytes')
              assert v['median']['sheetNonImageBytes']['after']<=v['median']['sheetNonImageBytes']['before']+1100,(profile,dev,'nonimage bytes')
              assert all(x['cacheWarmHomeBytes']<=1500 for x in v['after']),(profile,dev,'cache')
              assert 'LayoutCount' in v['mainThread'] and 'RecalcStyleCount' in v['mainThread'],(profile,dev,'CPU metrics unavailable')
              # Phase36 adds a median non-regression gate, with a small CI scheduling noise floor.
              assert v['median']['firstRowsMs']['after']<=v['median']['firstRowsMs']['before']*1.05+20,(profile,dev,'firstRows regression',v['median']['firstRowsMs'])
              for metric in ('ScriptDuration','TaskDuration','LayoutDuration','RecalcStyleDuration'):
                m=v['mainThread'][metric]
                assert m['after']<=m['before']*1.08+0.005,(profile,dev,metric,'CPU regression',m)
              if dev=='sp':
                assert all(x['appStats'] and x['appStats']['fitCalls']>=1 for x in v['after']),(profile,dev,'render instrumentation missing')
              out[profile+'-'+dev]={
                'median':{k:v['median'][k] for k in ('homeBytes','firstRowsMs','fontReadyMs','settledMs','sheetNonImageBytes')},
                'mainThread':v['mainThread'],
                'winningRounds':v['winningRounds']
              }
          (root/'cpu-layout-compare.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('PHASE36_CPU_LAYOUT_COMPARE',json.dumps(out,ensure_ascii=False))
          PY

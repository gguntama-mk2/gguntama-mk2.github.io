name: V18 Japanese Source Review and Hit-Icon Safety E2E
on:
  push:
    branches: [test/icon-auto-add-replace-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jp-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate latest PC and SP source audits through V18
        run: |
          python -m py_compile tests/guard_effect_v15.py tests/guard_effect_v16.py tests/guard_effect_v17.py tests/guard_effect_v18.py
          for target in pc sp; do
            node tools/build-hit-state-sidecar-v13.mjs "$target.html" "/tmp/pt-v18/$target-v13"
            node tools/audit-guard-crouch-v14.mjs "$target.html" "/tmp/pt-v18/$target-v13/v13_hit_state_review.json" "/tmp/pt-v18/$target-v14"
            python tests/guard_effect_v15.py "/tmp/pt-v18/$target-v14/V14_GUARD_REVIEW.json" "/tmp/pt-v18/$target-v15"
            python tests/guard_effect_v16.py "/tmp/pt-v18/$target-v15/V15_778_REVIEW.json" "/tmp/pt-v18/$target-v15/V15_REVIEW_128_DEDUPED.csv" test-data/v16-public-guard-evidence.json "/tmp/pt-v18/$target-v16"
            python tests/guard_effect_v17.py "/tmp/pt-v18/$target-v16/V16_128_REVIEW.json" test-data/v17-japanese-source-review.json "/tmp/pt-v18/$target-v17"
            python tests/guard_effect_v18.py "/tmp/pt-v18/$target-v17/V17_JAPANESE_REVIEW.json" test-data/v18-japanese-evidence-batch.json "/tmp/pt-v18/$target"
          done
          cp test-data/v18-jp-evidence-view.html /tmp/pt-v18/pc/index.html
      - name: Validate Japanese-first source statuses, ID preservation and safe writing
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('/tmp/pt-v18')
          a,b=[json.loads((root/k/'V17_JAPANESE_REVIEW.json').read_text()) for k in ['pc','sp']]
          assert a==b
          summary=a['summary']
          assert summary['priority_groups']==128
          assert summary['new_japanese_checks']==15
          assert (summary['japanese_explicit'],summary['japanese_notation_only'],summary['japanese_numeric_conflict'],summary['japanese_not_reviewed'])==(9,16,4,99)
          assert (summary['new_explicit'],summary['new_notation_only'],summary['new_numeric_conflict'])==(2,11,2)
          assert summary['binary_verified_moves']==summary['admin_icon_assignments']==summary['production_changes']==0
          assert summary['overseas_sources_used_as_final_evidence']==0
          byid={r['move_id']:r for r in a['records']}
          assert len(byid)==128
          assert byid['king/79']['jp_status']=='jp_explicit'
          assert byid['bryan/192']['jp_status']=='jp_explicit'
          assert byid['asuka/59']['jp_status']=='jp_notation_only'
          assert byid['claudio/74']['jp_status']=='jp_notation_only'
          assert byid['reina/106']['jp_status']=='jp_notation_only'
          assert byid['king/158']['jp_status']=='jp_numeric_conflict'
          assert byid['king/189']['jp_status']=='jp_numeric_conflict'
          assert sum(r['newly_reviewed_v18'] for r in a['records'])==15
          assert all(not r['approved_icon'] and not r['reviewed_current_version_binary'] and not r['overseas_used_for_approval'] for r in a['records'])
          print('PASS V18: 15 new Japanese checks, 99 pending, 2 new numeric conflicts, 0 icon writes')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Render Japanese review on real PC and smartphone browser
        run: |
          (cd /tmp/pt-v18/pc && python -m http.server 8739 --bind 127.0.0.1 > /tmp/pt-v18/server.log 2>&1) &
          python - <<'PY'
          from pathlib import Path
          import time,urllib.request
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8739/index.html'
          for i in range(40):
              try:urllib.request.urlopen(url,timeout=2);break
              except Exception:time.sleep(1)
          else:raise RuntimeError('local test server unavailable')
          with sync_playwright() as pw:
              browser=pw.chromium.launch(headless=True,args=['--disable-dev-shm-usage'])
              for kind,viewport in [('PC',{'width':1440,'height':900}),('SP',{'width':390,'height':844})]:
                  page=browser.new_page(viewport=viewport)
                  page.goto(url,wait_until='domcontentloaded')
                  page.wait_for_function("document.body.dataset.ready === 'true'",timeout=45000)
                  assert page.locator('tbody tr').count()==128
                  assert page.locator('#explicit').inner_text()=='9'
                  assert page.locator('#notation').inner_text()=='16'
                  assert page.locator('#conflict').inner_text()=='4'
                  assert page.locator('#remaining').inner_text()=='99'
                  page.locator('#status').select_option('jp_explicit')
                  assert page.locator('tbody tr').count()==9
                  assert page.locator('tbody tr[data-id="reina/107"]').count()==1
                  assert page.locator('tbody tr[data-id="king/79"]').count()==1
                  assert page.locator('tbody tr[data-id="bryan/192"]').count()==1
                  page.locator('#status').select_option('jp_numeric_conflict')
                  assert page.locator('tbody tr').count()==4
                  assert page.locator('tbody tr[data-id="jack8/106"] a').count()==2
                  assert page.locator('tbody tr[data-id="king/106"] a').count()==2
                  assert page.locator('tbody tr[data-id="king/158"] a').count()==2
                  page.locator('#status').select_option('jp_notation_only')
                  assert page.locator('tbody tr').count()==16
                  assert page.locator('tbody tr[data-id="asuka/59"]').count()==1
                  page.locator('#status').select_option('')
                  page.screenshot(path=str(Path('/tmp/pt-v18/pc')/(kind+'_V18_JAPANESE_EVIDENCE.png')),full_page=False)
                  page.close()
              browser.close()
          print('PASS V18: source hierarchy, filters and Japanese evidence links in PC/mobile')
          PY
      - name: Check source frontend still unchanged by test tools
        if: always()
        run: |
          git status --porcelain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PROJECT_T_V18_JAPANESE_EVIDENCE
          path: |
            /tmp/pt-v18/pc/
            /tmp/pt-v18/server.log
          retention-days: 30
          if-no-files-found: warn

name: PROJECT T Lite (character lazy test)
on:
  push:
    branches:
      - test/lite-character-phase3-20261107
    paths:
      - tools/pt_lite_split_stage1.py
      - tools/pt_lite_audit.py
      - tools/pt_lite_browser_smoke.mjs
      - tools/pt_lite_inspect.py
      - tools/pt_lite_lazy_pxstore.py
      - tools/pt_lite_character_probe.py
      - tools/pt_lite_lazy_characters.cjs
      - .github/workflows/pt-lite-test.yml
concurrency:
  group: pt-character-lazy-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-test-files:
    if: github.ref == 'refs/heads/test/lite-character-phase3-20261107'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract PC and SP heavy data into isolated files
        run: python3 tools/pt_lite_split_stage1.py
      - name: Extract per-image assets from legacy PXStore
        run: |
          python3 tools/pt_lite_inspect.py
          python3 tools/pt_lite_lazy_pxstore.py
          python3 tools/pt_lite_character_probe.py
          node tools/pt_lite_lazy_characters.cjs
      - name: Test HTML sizes and JavaScript syntax
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('test-litev1/assets/data/build-report.json').read_text())
          for device,d in r['devices'].items():
              assert d['lite_html_bytes'] < 1000000, (device,d)
              assert d['script_count'] > 3, (device,d)
              print(device, d['html'], '->', d['lite_html_bytes'], 'bytes')
          assert r['media_files'] > 0
          p=json.loads(pathlib.Path('test-litev1/assets/data/pxstore-lazy-report.json').read_text())
          assert p['distinct_image_files'] > 10
          assert p['new_pxs_script_bytes'] < 100000
          assert p['preserves']['pixel_bytes']
          c=json.loads(pathlib.Path('test-litev1/assets/data/character-lazy-report.json').read_text())
          assert c['character_count']==44
          assert c['pc']['code_bytes'] < 350000
          assert c['sp']['code_bytes'] < 350000
          PY
          python3 tools/pt_lite_audit.py
          python3 - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('test-litev1/assets/data/asset-audit.json').read_text())
          for device,d in a['devices'].items():
              assert d['eager_local_asset_bytes'] < 2000000, (device,d['eager_local_asset_bytes'])
              print('eager',device,d['eager_local_asset_bytes'],'bytes')
          PY
          find test-litev1/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Browser smoke test (desktop and mobile)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/pt_lite_browser_smoke.mjs
      - name: Save files ONLY in this test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-litev1
          if ! git diff --cached --quiet; then
            git commit -m "test: store externalized PC SP assets (no production deployment)"
            git push origin HEAD:test/lite-character-phase3-20261107
          fi

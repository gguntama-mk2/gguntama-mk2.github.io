<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PROJECT T 技アイコン解析 テスト環境</title>
<style>body{font:14px/1.6 system-ui,sans-serif;background:#14151f;color:#ececf7;margin:20px}button,select{font:inherit;padding:8px;background:#333957;color:white;border:1px solid #777;border-radius:7px}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{border:1px solid #50536b;text-align:left;padding:5px 9px}th{position:sticky;top:0;background:#262b43}iframe{display:none}.muted{color:#b8b9d2}.warn{color:#ffbd76}#results{max-height:72vh;overflow:auto}</style></head>
<body><h1>PROJECT T：技アイコン対応調査（テスト環境専用）</h1>
<p class="warn">元サイトの確定タグに基づく既存自動判定の監査です。MOTBINからアイコンの意味を確定した結果ではありません。サーバーへの書き込み・削除は行いません。</p>
<p>データ出典：同じブランチの pc.html（全キャラクター技データ）。管理者の既存登録は変更しません。</p>
<label for="char">キャラクター</label> <select id="char"></select> <button id="run">現在の自動判定を照合</button> <button id="csv" disabled>CSVを書き出す</button>
<p id="status" role="status">解析用データを読み込んでいます…</p><div id="results"></div>
<iframe id="source" title="技データ参照" src="pc.html?ptpreview=1"></iframe>
<script src="move-icons.js"></script><script>
"use strict";
let rows=[];
const $=id=>document.getElementById(id);
function h(tag,value){const e=document.createElement(tag);e.textContent=value;return e}
function initialize(){
 const w=$("source").contentWindow;
 if(!w || !Array.isArray(w.CHARACTERS) || typeof w.moveInfo!=="function" || !window.PTIcons){$("status").textContent="データ参照APIが見つかりません。";return}
 const sel=$("char");
 sel.replaceChildren();
 sel.appendChild(new Option("全キャラクター","*"));
 for(const c of w.CHARACTERS)sel.appendChild(new Option(c.name,c.id));
 $("status").textContent=w.CHARACTERS.length+"キャラクターを読込。照合を実行できます。";
 $("run").onclick=()=>{
  rows=[];
  let all=0, withIcons=0;
  for(const c of w.CHARACTERS){
   if(sel.value!=="*"&&c.id!==sel.value)continue;
   for(const m of c.moves||[]){
    all++;
    const tags=w.moveInfo(m).tags.map(t=>t.id);
    const icons=window.PTIcons.auto(c.id,m,tags);
    if(!icons.length)continue;
    withIcons++;
    rows.push([c.id,m.k,m.name,(m.a&&m.a.command)||"",icons.join("|"),"site_auto_tag_or_name","NOT_GAME_BINARY_VERIFIED"]);
   }
  }
  $("status").textContent="対象 "+all+"技／サイト側の既存自動判定でアイコンあり "+withIcons+"技。ゲーム由来の追加確定は0件。";
  const table=h("table",""), head=document.createElement("thead"), body=document.createElement("tbody");
  const tr=document.createElement("tr");
  ["キャラ","k","技名","コマンド","アイコン","根拠"].forEach(x=>tr.appendChild(h("th",x)));head.appendChild(tr);
  rows.slice(0,3000).forEach(r=>{const tr=document.createElement("tr");r.slice(0,6).forEach(x=>tr.appendChild(h("td",String(x))));body.appendChild(tr)});
  table.append(head,body);$("results").replaceChildren(table);$("csv").disabled=!rows.length;
 };
 $("csv").onclick=()=>{
  const data=[["character_id","site_k","move_name","command","icons","evidence","game_binary_verified"],...rows];
  const csv=data.map(a=>a.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob(["\ufeff",csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="project-t-icon-site-auto-audit.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
}
$("source").addEventListener("load",initialize);
</script></body></html>

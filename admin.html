<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>PROJECT T 管理者ページ</title>
<style>
  :root { --bg:#14151f; --panel:#1d1f2e; --panel2:#262942; --line:#3a3e63; --text:#e9eaf4; --sub:#9a9dc0; --accent:#f2c14e; --ok:#5ad1a6; --warn:#ff9f43; --ng:#ff5f7a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  a { color:var(--accent); }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  header .who { margin-left:auto; color:var(--sub); font-size:12px; }
  nav.tabs { display:flex; gap:6px; }
  nav.tabs button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font:inherit; }
  nav.tabs button[aria-pressed="true"] { background:var(--accent); color:#1a1330; border-color:var(--accent); font-weight:700; }
  main { padding:14px 16px 60px; max-width:1500px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .center { max-width:560px; margin:60px auto; text-align:center; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#1a1330; border-color:var(--accent); font-weight:700; }
  .btn.danger { border-color:var(--ng); color:var(--ng); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=search], input:not([type]), select, textarea { background:#10111a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; width:100%; }
  textarea { resize:vertical; min-height:3.4em; }
  label.chk { display:inline-flex; align-items:center; gap:4px; color:var(--sub); font-size:12px; white-space:nowrap; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .muted { color:var(--sub); font-size:12px; }
  .banner { padding:9px 12px; border-radius:8px; margin-bottom:10px; border:1px solid var(--line); background:var(--panel2); }
  .banner.warn { border-color:var(--warn); } .banner.err { border-color:var(--ng); } .banner.ok { border-color:var(--ok); }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--sub); }
  .badge.pub { border-color:var(--ok); color:var(--ok); } .badge.draft { border-color:var(--warn); color:var(--warn); }
  #chars { display:flex; flex-wrap:wrap; gap:6px; }
  #chars button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 9px; cursor:pointer; font:inherit; display:flex; gap:6px; align-items:center; }
  #chars button[aria-pressed="true"] { border-color:var(--accent); outline:1px solid var(--accent); }
  .editor { display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:12px; align-items:start; }
  #mlist { max-height:70vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  #mlist button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-bottom:1px solid var(--line); padding:5px 8px; cursor:pointer; font:inherit; }
  #mlist button[aria-pressed="true"] { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
  #mlist .k { color:var(--sub); font-size:11px; margin-right:6px; }
  #mlist .chg::after { content:" ●"; color:var(--warn); } #mlist .new::after { content:" ＋新規"; color:var(--ok); font-size:11px; }
  .grid { display:grid; grid-template-columns:130px 1fr auto; gap:6px 10px; align-items:start; }
  .grid .lab { color:var(--sub); padding-top:6px; font-size:13px; }
  .tags { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px 10px; }
  .tags .t { display:flex; gap:6px; align-items:center; font-size:12px; } .tags .t select { width:auto; }
  .pv { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .pv iframe { border:1px solid var(--line); border-radius:8px; background:#000; }
  #pvPC { flex:1 1 640px; height:72vh; min-width:0; max-width:100%; } #pvSP { width:390px; max-width:100%; height:72vh; }
  .tw { overflow-x:auto; max-width:100%; }
  table { border-collapse:collapse; width:100%; } th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; font-size:13px; }
  th { color:var(--sub); font-weight:600; }
  .badge.stale { border-color:var(--warn); color:var(--warn); background:rgba(255,159,67,.08); }
  .modal-back { position:fixed; inset:0; background:rgba(5,6,12,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:16px 18px; width:min(560px,100%); max-height:90vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .modal h2 { font-size:16px; margin:0 0 8px; }
  .modal .mbody p { margin:6px 0; }
  .modal .mact { justify-content:flex-end; margin-top:14px; }
  dl.who-dl { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; margin:8px 0; padding:8px 10px; background:var(--panel2); border-radius:8px; }
  dl.who-dl dt { color:var(--sub); font-size:12px; } dl.who-dl dd { margin:0; word-break:break-all; }
  .dsec { margin:10px 0 4px; font-weight:700; color:var(--accent); font-size:13px; } .drow { padding:3px 0; border-bottom:1px dashed var(--line); } .drow .k { color:var(--sub); font-size:11px; }
  #diffBox details { margin:4px 0; border-bottom:1px dashed var(--line); } #diffBox summary { cursor:pointer; padding:3px 0; }
  #secMedia .pt-mm-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; align-items:end; }
  #secMedia .pt-mm-form label { display:flex; flex-direction:column; gap:5px; }
  #secMedia .pt-mm-form button { justify-self:start; }
  #secIcons .pt-mi-bar { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; } #secIcons .pt-mi-bar input { flex:1 1 220px; }
  #secIcons .pt-mi-cell { display:flex; gap:3px; align-items:center; min-height:22px; } #secIcons table td { vertical-align:middle; } #secIcons .pt-mi-cell img { border-radius:4px; }
  #secIcons .pt-mi-editor { margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:10px; }
  #secIcons .pt-mi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:8px; margin:10px 0; }
  #secIcons .pt-mi-opt { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; cursor:pointer; } #secIcons .pt-mi-opt img { border-radius:5px; flex:none; }
  #secIcons .pt-mi-actions { display:flex; gap:10px; flex-wrap:wrap; }
  #secIcons [data-state="error"] { color:var(--ng); } #secIcons [data-state="ok"] { color:var(--ok); }
  #secMedia [data-state="error"] { color:var(--ng); } #secMedia [data-state="ok"] { color:var(--ok); }
  .hist li { margin:3px 0; } code { background:#10111a; padding:0 5px; border-radius:4px; font-size:12px; }
  @media (max-width:860px) { .editor { grid-template-columns:1fr; } #mlist { max-height:30vh; } .grid { grid-template-columns:100px 1fr; } .grid .off { grid-column:2; } #pvSP { width:100%; } }
</style>
</head>
<body>
<header>
  <h1>PROJECT T 管理者ページ</h1>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-tab="sheet" aria-pressed="true">技チェックシート編集</button>
    <button type="button" data-tab="users" aria-pressed="false">管理者</button>
    <button type="button" data-tab="media" aria-pressed="false">技動画登録</button>
    <button type="button" data-tab="icons" aria-pressed="false">技アイコン設定</button>
    <button type="button" data-tab="audit" aria-pressed="false">操作の記録</button>
  </nav>
  <span class="who" id="who"></span>
</header>
<main id="app"><div class="center card">確認しています…</div></main>
<script src="admin.js" defer></script>
<script src="admin-move-media.js" defer></script>
<script src="admin-move-icons.js" defer></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>PROJECT T 管理者ページ</title>
<style>
  :root { --bg:#14151f; --panel:#1d1f2e; --panel2:#262942; --line:#3a3e63; --text:#e9eaf4; --sub:#9a9dc0; --accent:#f2c14e; --ok:#5ad1a6; --warn:#ff9f43; --ng:#ff5f7a; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 system-ui, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  a { color:var(--accent); }
  header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  header .who { margin-left:auto; color:var(--sub); font-size:12px; }
  nav.tabs { display:flex; gap:6px; }
  nav.tabs button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 14px; cursor:pointer; font:inherit; }
  nav.tabs button[aria-pressed="true"] { background:var(--accent); color:#1a1330; border-color:var(--accent); font-weight:700; }
  main { padding:14px 16px 60px; max-width:1500px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .center { max-width:560px; margin:60px auto; text-align:center; }
  .btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); color:#1a1330; border-color:var(--accent); font-weight:700; }
  .btn.danger { border-color:var(--ng); color:var(--ng); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=search], input:not([type]), select, textarea { background:#10111a; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; width:100%; }
  textarea { resize:vertical; min-height:3.4em; }
  label.chk { display:inline-flex; align-items:center; gap:4px; color:var(--sub); font-size:12px; white-space:nowrap; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .muted { color:var(--sub); font-size:12px; }
  .banner { padding:9px 12px; border-radius:8px; margin-bottom:10px; border:1px solid var(--line); background:var(--panel2); }
  .banner.warn { border-color:var(--warn); } .banner.err { border-color:var(--ng); } .banner.ok { border-color:var(--ok); }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--sub); }
  .badge.pub { border-color:var(--ok); color:var(--ok); } .badge.draft { border-color:var(--warn); color:var(--warn); }
  #chars { display:flex; flex-wrap:wrap; gap:6px; }
  #chars button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 9px; cursor:pointer; font:inherit; display:flex; gap:6px; align-items:center; }
  #chars button[aria-pressed="true"] { border-color:var(--accent); outline:1px solid var(--accent); }
  .editor { display:grid; grid-template-columns:minmax(220px,300px) 1fr; gap:12px; align-items:start; }
  :root { --hh:60px; }
  .editor > .mleft { position:sticky; top:calc(var(--hh) + 8px); display:flex; flex-direction:column; height:calc(100vh - var(--hh) - 20px); min-height:360px; }   /* 左の技一覧は、スクロールしても画面に留まる。一覧は残りの高さいっぱい */
  #mlist { flex:1 1 auto; min-height:240px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  #mlist button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-bottom:1px solid var(--line); padding:5px 8px; cursor:pointer; font:inherit; }
  #mlist button[aria-pressed="true"] { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
  #mlist .k { color:var(--sub); font-size:11px; margin-right:6px; }
  #mlist .chg::after { content:" ●"; color:var(--warn); } #mlist .new::after { content:" ＋新規"; color:var(--ok); font-size:11px; }
  .grid { display:grid; grid-template-columns:130px 1fr auto; gap:6px 10px; align-items:start; }
  .grid .lab { color:var(--sub); padding-top:6px; font-size:13px; }
  .tags { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px 10px; }
  .tags .t { display:flex; gap:6px; align-items:center; font-size:12px; } .tags .t select { width:auto; }
  .pv { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start; }
  .pv iframe { border:1px solid var(--line); border-radius:8px; background:#000; }
  #pvPC { flex:1 1 640px; height:72vh; min-width:0; max-width:100%; } #pvSP { width:390px; max-width:100%; height:72vh; }
  .tw { overflow-x:auto; max-width:100%; }
  table { border-collapse:collapse; width:100%; } th, td { border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top; font-size:13px; }
  th { color:var(--sub); font-weight:600; }
  .badge.stale { border-color:var(--warn); color:var(--warn); background:rgba(255,159,67,.08); }
  .modal-back { position:fixed; inset:0; background:rgba(5,6,12,.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal { background:var(--panel); border:1px solid var(--accent); border-radius:12px; padding:16px 18px; width:min(560px,100%); max-height:90vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  .modal h2 { font-size:16px; margin:0 0 8px; }
  .modal .mbody p { margin:6px 0; }
  .modal .mact { justify-content:flex-end; margin-top:14px; }
  dl.who-dl { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; margin:8px 0; padding:8px 10px; background:var(--panel2); border-radius:8px; }
  dl.who-dl dt { color:var(--sub); font-size:12px; } dl.who-dl dd { margin:0; word-break:break-all; }
  .dsec { margin:10px 0 4px; font-weight:700; color:var(--accent); font-size:13px; } .drow { padding:3px 0; border-bottom:1px dashed var(--line); } .drow .k { color:var(--sub); font-size:11px; }
  #diffBox details { margin:4px 0; border-bottom:1px dashed var(--line); } #diffBox summary { cursor:pointer; padding:3px 0; }
  #secMedia .pt-mm-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; align-items:end; }
  #secMedia .pt-mm-form label { display:flex; flex-direction:column; gap:5px; }
  #secMedia .pt-mm-form button { justify-self:start; }
  #secIcons .pt-mi-bar { display:flex; flex-wrap:wrap; gap:10px; margin:10px 0; } #secIcons .pt-mi-bar input { flex:1 1 220px; }
  #secIcons .pt-mi-cell { display:flex; gap:3px; align-items:center; min-height:22px; } #secIcons table td { vertical-align:middle; } #secIcons .pt-mi-cell img { border-radius:4px; }
  #secIcons .pt-mi-wrap { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:16px; align-items:start; }
  #secIcons .pt-mi-editor { position:sticky; top:calc(var(--hh) + 8px); max-height:calc(100vh - var(--hh) - 20px); overflow:auto; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--panel,#1c1f2e); }
  #secIcons .pt-mi-editor h3 { margin:0 0 6px; font-size:1rem; } #secIcons .pt-mi-hint { color:var(--sub,#99a); margin:0; }
  #secIcons .pt-mi-close { display:none; float:right; }
  #secIcons .pt-mi-ck, #secIcons th:last-child { width:34px; text-align:center; } #secIcons .pt-mi-ck input, #secIcons th:last-child input { width:18px; height:18px; cursor:pointer; }
  /* 一覧の列幅を固定する（アイコンの有無や技名の長さで、列がずれないように） */
  #secIcons table.pt-mi-list { table-layout:fixed; width:100%; }
  #secIcons table.pt-mi-list th:nth-child(1) { width:44px; } #secIcons table.pt-mi-list th:nth-child(3) { width:17%; } #secIcons table.pt-mi-list th:nth-child(4) { width:25%; } #secIcons table.pt-mi-list th:nth-child(5) { width:104px; } #secIcons table.pt-mi-list th:nth-child(6) { width:72px; } #secIcons table.pt-mi-list th:nth-child(7) { width:34px; }
  #secIcons table.pt-mi-list td { overflow-wrap:anywhere; } #secIcons table.pt-mi-list td:nth-child(5), #secIcons table.pt-mi-list td:nth-child(6) { white-space:nowrap; overflow-wrap:normal; }
  #secIcons table.pt-mi-list .pt-mi-cell { flex-wrap:wrap; row-gap:2px; }
  #secIcons .pt-mi-modes { display:flex; gap:12px; flex-wrap:wrap; margin:8px 0 2px; } #secIcons .pt-mi-mode { display:flex; align-items:center; gap:5px; cursor:pointer; }
  #secIcons .pt-mi-bulkbtn { display:none; margin:6px 0; }
  @media (max-width:999px) { #secIcons .pt-mi-bulkbtn:not([hidden]) { display:inline-block; } }
  #secIcons tr[data-sel] td { background:rgba(240,192,64,.14); }
  #secIcons .pt-mi-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:4px 0 6px; } #secIcons .pt-mi-grid .pt-mi-opt { padding:4px 6px; font-size:.72rem; } #secIcons .pt-mi-grid .pt-mi-opt img { width:24px; height:24px; }
  #secIcons .pt-mi-zones h4 { margin:8px 0 2px; font-size:.8125rem; color:var(--sub); }
  #secIcons .pt-mi-matrix { width:100%; border-collapse:collapse; } #secIcons .pt-mi-matrix th { font-size:.6875rem; text-align:center; padding:2px 4px; } #secIcons .pt-mi-matrix th:first-child { text-align:left; }
  #secIcons .pt-mi-matrix td { padding:1px 4px; border-top:1px solid var(--line); } #secIcons .pt-mi-nm { display:flex; align-items:center; gap:6px; font-size:.75rem; line-height:1.25; } #secIcons .pt-mi-nm img { flex:none; }
  #secIcons .pt-mi-ck2 { width:78px; text-align:center; } #secIcons .pt-mi-ck2 input { width:16px; height:16px; margin:0; cursor:pointer; }
  #secIcons .pt-mi-zg { display:inline-flex; align-items:center; gap:2px; margin-right:6px; } #secIcons .pt-mi-zg b { font-size:.625rem; color:var(--sub); margin-right:1px; }
  #secIcons .pt-mi-opt { display:flex; align-items:center; gap:6px; padding:5px 6px; font-size:.78rem; line-height:1.25; min-width:0; } #secIcons .pt-mi-opt img { width:28px; height:28px; flex:none; } #secIcons .pt-mi-opt span { min-width:0; overflow-wrap:anywhere; }
  @media (max-width:999px) { #secIcons .pt-mi-wrap { display:block; }
    #secIcons .pt-mi-editor { display:none; position:fixed; top:0; right:0; bottom:0; max-height:none; width:min(360px,92vw); z-index:50; border-radius:12px 0 0 12px; box-shadow:-8px 0 30px rgba(0,0,0,.5); }
    #secIcons .pt-mi-editor[data-open] { display:block; } #secIcons .pt-mi-close { display:inline-block; } }
  #secIcons .pt-mi-opt { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; cursor:pointer; } #secIcons .pt-mi-opt img { border-radius:5px; flex:none; }
  #secIcons .pt-mi-actions { display:flex; gap:10px; flex-wrap:wrap; }
  #secIcons [data-state="error"] { color:var(--ng); } #secIcons [data-state="ok"] { color:var(--ok); }
  #secMedia [data-state="error"] { color:var(--ng); } #secMedia [data-state="ok"] { color:var(--ok); }
  .hist li { margin:3px 0; } code { background:#10111a; padding:0 5px; border-radius:4px; font-size:12px; }

  /* 管理者一覧：PCは比較表、スマホは読みやすい1ユーザー1カード */
  #secUsers { min-width:0; }
  #secUsers .pt-users-title { display:flex; align-items:baseline; flex-wrap:wrap; gap:6px 14px; margin-bottom:10px; }
  #secUsers .pt-users-title h2 { margin:0; font-size:17px; }
  #secUsers .pt-users-count { font-size:13px; color:var(--sub); }
  #secUsers .pt-users-controls { display:grid; grid-template-columns:minmax(220px,1fr) minmax(250px,1fr); gap:12px; margin:12px 0; }
  #secUsers .pt-users-search { display:grid; gap:6px; align-content:start; min-width:0; }
  #secUsers .pt-users-search label { font-size:13px; color:var(--text); font-weight:600; }
  #secUsers .pt-users-search input { width:100%; min-width:0; min-height:42px; padding:9px 11px; font-size:16px; }
  #secUsers .pt-users-grant { min-width:0; border:1px solid var(--line); border-radius:9px; padding:8px 12px; }
  #secUsers .pt-users-grant summary { cursor:pointer; font-weight:600; padding:3px 0; }
  #secUsers .pt-users-grant .row { margin-top:10px; }
  #secUsers .pt-users-grant input { flex:1 1 210px; min-width:0; min-height:40px; font-size:14px; }
  #secUsers .pt-users-grant .btn { min-height:40px; }
  #secUsers .pt-users-policy { margin:8px 0; color:var(--sub); font-size:12px; }
  #secUsers .pt-users-policy summary { cursor:pointer; }
  #secUsers .pt-users-policy p { margin:8px 0; }
  #secUsers .pt-users-result-label { color:var(--sub); font-size:12px; margin:8px 0; }
  #secUsers .pt-users-desktop { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  #secUsers .pt-users-desktop table { min-width:1000px; table-layout:auto; }
  #secUsers .pt-users-desktop th, #secUsers .pt-users-desktop td { white-space:nowrap; vertical-align:middle; padding:10px 9px; }
  #secUsers .pt-users-desktop tr:hover td { background:rgba(255,255,255,.035); }
  #secUsers .pt-users-desktop code { font-size:12px; white-space:nowrap; }
  #secUsers .badge { display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; flex:none; line-height:1.35; padding:3px 9px; }
  #secUsers .pt-users-cards { display:none; }
  #secUsers .pt-users-pagination { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; padding-top:14px; }
  #secUsers .pt-users-pagination .btn { min-height:40px; }
  #secUsers .pt-users-empty { padding:26px 14px; text-align:center; color:var(--sub); background:var(--panel2); border-radius:10px; }
  #secUsers button:focus-visible, #secUsers input:focus-visible, nav.tabs button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  #who { min-width:0; }
  #who .who-name { font-weight:600; color:var(--text); }
  #who .who-id { font-size:12px; }
  #who .who-copy { background:transparent; color:var(--accent); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer; font-size:12px; white-space:nowrap; }
  @media (max-width:800px) {
    header { position:static; display:flex; flex-direction:column; align-items:stretch; gap:9px; padding:13px 12px 10px; }
    header h1 { font-size:18px; line-height:1.3; }
    header .who { order:1; margin:0; display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; line-height:1.3; }
    header .who .who-id { display:none; }
    nav.tabs { order:2; display:flex; width:100%; max-width:100%; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x proximity; padding:1px 1px 8px; gap:7px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
    nav.tabs button { flex:0 0 auto; min-width:max-content; min-height:42px; white-space:nowrap; word-break:keep-all; padding:8px 12px; border-radius:9px; scroll-snap-align:start; font-size:13px; line-height:1.3; }
    main { padding:12px 10px 50px; min-width:0; }
    #secUsers .card { padding:14px 12px; }
    #secUsers .pt-users-title { display:block; }
    #secUsers .pt-users-title h2 { font-size:17px; }
    #secUsers .pt-users-count { display:block; margin-top:3px; }
    #secUsers .pt-users-controls { grid-template-columns:minmax(0,1fr); gap:10px; }
    #secUsers .pt-users-grant .row { display:grid; grid-template-columns:minmax(0,1fr); }
    #secUsers .pt-users-grant input, #secUsers .pt-users-grant .btn { width:100%; }
    #secUsers .pt-users-desktop { display:none; }
    #secUsers .pt-users-cards { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
    #secUsers .pt-user-card { padding:14px; min-width:0; border:1px solid var(--line); background:var(--panel2); border-radius:12px; }
    #secUsers .pt-user-head { display:flex; align-items:flex-start; gap:12px; justify-content:space-between; padding-bottom:12px; border-bottom:1px solid var(--line); }
    #secUsers .pt-user-name { font-size:17px; font-weight:700; line-height:1.4; overflow-wrap:anywhere; }
    #secUsers .pt-user-self { font-size:11px; color:var(--sub); margin-top:2px; }
    #secUsers .pt-user-head .badge { margin-top:2px; }
    #secUsers .pt-user-fields { display:grid; gap:13px; margin:14px 0 12px; }
    #secUsers .pt-user-fields .pt-user-field { min-width:0; margin:0; }
    #secUsers .pt-user-field dt { color:var(--sub); font-size:12px; font-weight:600; margin-bottom:4px; }
    #secUsers .pt-user-field dd { margin:0; min-width:0; font-size:14px; line-height:1.5; }
    #secUsers .pt-user-id-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; min-width:0; }
    #secUsers .pt-user-id-row code { background:#121320; color:var(--text); padding:5px 7px; border-radius:6px; font-size:13px; line-height:1.45; overflow-wrap:anywhere; word-break:break-word; white-space:normal; min-width:0; max-width:100%; }
    #secUsers .pt-user-id-row .badge { min-height:26px; font-size:12px; }
    #secUsers .pt-user-id-row .pt-copy { margin-left:auto; flex:none; min-height:32px; }
    #secUsers .pt-user-extra { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
    #secUsers .pt-user-extra .pt-user-field { min-width:0; }
    #secUsers .pt-user-extra dd { overflow-wrap:anywhere; font-size:13px; }
    #secUsers .pt-user-action { padding-top:12px; border-top:1px solid var(--line); }
    #secUsers .pt-user-action .btn { width:100%; min-height:42px; white-space:nowrap; }
    #secUsers .pt-users-pagination { justify-content:center; }
  }
  @media (max-width:350px) {
    #secUsers .pt-user-extra { grid-template-columns:minmax(0,1fr); }
    #secUsers .pt-user-id-row code { font-size:12px; }
  }

  /* Mobile administration design system: readable forms, touch targets and data cards. */
  #secSheet .pt-sheet-mobile-picker { display:none; }
  #secSheet .pt-sheet-char-caption { color:var(--sub); font-size:12px; margin-bottom:7px; }
  #secSheet .pt-sheet-toolbar { display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
  #secSheet .pt-sheet-tool-heading { display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; min-width:0; }
  #secSheet .pt-sheet-tool-heading b { font-size:17px; }
  #secSheet .pt-sheet-tool-heading .badge { white-space:normal; }
  #secSheet .pt-sheet-primary-actions { display:flex; flex-wrap:wrap; gap:8px; }
  #secSheet .pt-sheet-primary-actions .btn { min-height:40px; min-width:135px; }
  #secSheet .pt-sheet-more { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  #secSheet .pt-sheet-more summary { cursor:pointer; color:var(--sub); font-weight:600; }
  #secSheet .pt-sheet-extra-actions { display:flex; flex-wrap:wrap; gap:8px; padding:10px 0 2px; }
  #secSheet .pt-sheet-more .btn { min-height:38px; }
  #secSheet .pt-sheet-tool-note { margin:0; font-size:12px; }
  #secSheet .pt-sheet-move-search-label, #secSheet .pt-sheet-matches { display:block; color:var(--sub); font-size:12px; }
  #secSheet #ptSheetMoveSearch { width:100%; margin:4px 0; min-height:40px; font-size:15px; }
  #secSheet .pt-sheet-matches { margin:2px 0 5px; }
  #secSheet .pt-sheet-form-area { min-width:0; }
  #secSheet .pt-sheet-form-area input, #secSheet .pt-sheet-form-area textarea { min-width:0; max-width:100%; }
  #secSheet .pt-sheet-list-actions { margin:6px 0; }
  #secSheet .pt-sheet-list-actions select { min-width:0; flex:1 1 150px; }
  #secMedia .pt-mm-form input, #secMedia .pt-mm-form select { min-width:0; max-width:100%; }
  #secMedia .pt-mm-form input[type=file] { overflow:hidden; font-size:14px; }
  #secMedia .pt-mm-form button { min-height:44px; }
  #secIcons .pt-mi-list td:nth-child(2), #secIcons .pt-mi-list td:nth-child(3) { overflow-wrap:anywhere; }
  #secIcons .pt-mi-editor { min-width:0; }
  #secIcons .pt-mi-backdrop { display:none; }
  #secCloud .card { min-width:0; }
  #secCloud h2, #secCloud h3, #secMedia h2 { overflow-wrap:anywhere; }
  @media (max-width:800px) {
    #secSheet .pt-sheet-character-panel { padding:12px; }
    #secSheet .pt-sheet-char-caption, #secSheet #chars { display:none; }
    #secSheet .pt-sheet-mobile-picker { display:grid; gap:6px; }
    #secSheet .pt-sheet-mobile-picker label { font-size:13px; color:var(--sub); font-weight:600; }
    #secSheet .pt-sheet-mobile-picker select { display:block; width:100%; min-width:0; min-height:46px; padding:9px 12px; font-size:16px; }
    #secSheet .pt-sheet-toolbar { gap:12px; padding:12px; }
